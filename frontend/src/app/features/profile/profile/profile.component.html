<div class="container profile-page">
  <h1 class="section-heading">{{ 'nav.profile' | translate }}</h1>

  <div class="profile-layout">
    <div class="profile-card">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="field">
          <label>{{ 'auth.name' | translate }}</label>
          <input type="text" class="form-control" formControlName="name" />
        </div>
        <div class="field">
          <label>{{ 'auth.email' | translate }}</label>
          <input type="email" class="form-control" formControlName="email" />
        </div>
        <div class="field">
          <label>{{ 'auth.phone' | translate }}</label>
          <input type="tel" class="form-control" formControlName="phone" />
        </div>
        <button type="submit" class="btn btn-signal" [disabled]="saving()">{{ 'common.save' | translate }}</button>
      </form>
    </div>

    <div class="profile-links">
      <a routerLink="/orders"><i class="bi bi-receipt"></i> {{ 'nav.myOrders' | translate }}</a>
      <a routerLink="/addresses"><i class="bi bi-geo-alt"></i> {{ 'nav.addresses' | translate }}</a>
    </div>
  </div>
</div>
