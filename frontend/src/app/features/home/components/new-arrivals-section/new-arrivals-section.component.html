<section class="section new-arrivals-section">
  <div class="container">
    <div class="section-header">
      <h2 class="section-heading">{{ 'section.newArrivals' | translate }}</h2>
      <a class="view-all" routerLink="/new-arrivals">{{ 'common.viewAll' | translate }} <i class="bi bi-arrow-right flip-x"></i></a>
    </div>
    @if (loading()) {
      <app-loading-spinner></app-loading-spinner>
    } @else {
      <div class="product-row">
        @for (product of products(); track product.id) {
          <app-product-card [product]="product" (addToCart)="onAddToCart($event)"></app-product-card>
        }
      </div>
    }
  </div>
</section>
