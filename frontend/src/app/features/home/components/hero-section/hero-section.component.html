<section class="hero">
  <div class="container hero-grid">
    <div class="hero-copy">
      <h1>{{ 'hero.title' | translate }}</h1>
      <p>{{ 'hero.subtitle' | translate }}</p>
      <div class="hero-actions">
        <a class="btn btn-signal" routerLink="/men">{{ 'hero.shopMen' | translate }}</a>
        <a class="btn btn-outline-ink" routerLink="/women">{{ 'hero.shopWomen' | translate }}</a>
      </div>
    </div>
    <div class="hero-media">
      <img src="https://images.unsplash.com/photo-1523398002811-999ca8dec234?auto=format&fit=crop&w=900&q=80" alt="Street style outfit" />
    </div>
  </div>
</section>
