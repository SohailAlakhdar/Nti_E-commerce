<div class="admin-content-edit">
  <h1 class="section-heading">Policies</h1>

  @if (loading()) {
    <app-loading-spinner></app-loading-spinner>
  } @else {
    <form [formGroup]="form" (ngSubmit)="submit()" class="form-card">
      <div class="field">
        <label>Return Policy</label>
        <textarea class="form-control" rows="3" formControlName="returnPolicy"></textarea>
      </div>
      <div class="field">
        <label>Exchange Policy</label>
        <textarea class="form-control" rows="3" formControlName="exchangePolicy"></textarea>
      </div>
      <div class="field">
        <label>Privacy Policy</label>
        <textarea class="form-control" rows="3" formControlName="privacyPolicy"></textarea>
      </div>
      <div class="field">
        <label>Terms &amp; Conditions</label>
        <textarea class="form-control" rows="3" formControlName="termsAndConditions"></textarea>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-signal" [disabled]="saving()">Save</button>
      </div>
    </form>
  }
</div>
