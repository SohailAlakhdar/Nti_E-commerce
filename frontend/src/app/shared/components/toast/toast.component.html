<div class="toast-stack">
  @for (toast of notificationService.toasts(); track toast.id) {
    <div class="toast-item" [class]="'toast-' + toast.variant">
      <i class="bi" [class]="iconFor(toast.variant)"></i>
      <span>{{ toast.message }}</span>
      <button type="button" class="toast-close" (click)="notificationService.dismiss(toast.id)" aria-label="Close">
        <i class="bi bi-x"></i>
      </button>
    </div>
  }
</div>
