@if (open) {
  <div class="modal-backdrop-custom" (click)="cancelled.emit()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <h3>{{ title }}</h3>
      <p>{{ message }}</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-outline-ink" (click)="cancelled.emit()">{{ cancelLabel }}</button>
        <button type="button" class="btn btn-signal" (click)="confirmed.emit()">{{ confirmLabel }}</button>
      </div>
    </div>
  </div>
}
